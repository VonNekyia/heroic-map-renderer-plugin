name: Hangar

# Lädt das Jar eines veröffentlichten Releases als Version <version> auf
# Hangar, mit den Notizen aus notizen.sh. Von Hand mit dem Tag als Eingabe.
# Siehe docs/entscheidungen/0009-hangar-mit-curl.md und
# docs/entscheidungen/0011-ein-jar-mit-xz.md.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag des Releases, etwa v0.3.2
        required: true

permissions:
  contents: read

env:
  # Das Projekt auf Hangar: https://hangar.papermc.io/Neky/heroic-map
  HANGAR_PROJEKT: heroic-map
  HANGAR_API: https://hangar.papermc.io/api/v1
  # Die Versionen von Paper, auf denen das Plugin läuft, siehe docs/alpha.md.
  PAPER: '["26.2", "26.3"]'

defaults:
  run:
    shell: bash

jobs:
  hangar:
    name: Auf Hangar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # CHANGELOG.md, NOTICE und notizen.sh so, wie sie am Tag stehen.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      # Der Schlüssel kommt nur aus dem Secret; er und das JWT stehen maskiert
      # und nie im Log. Ohne Secret nur eine Warnung, das Release bleibt grün.
      - name: Hochladen
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
          HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$HANGAR_API_TOKEN" ]; then
            echo "::warning::Das Secret HANGAR_API_TOKEN fehlt; nichts auf Hangar hochgeladen"
            exit 0
          fi
          echo "::add-mask::$HANGAR_API_TOKEN"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$TAG ist kein Tag eines Releases wie v1.2.3"; exit 1; }
          version=${TAG#v}

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "heroic-map-renderer-plugin-$version.jar" --pattern SHA256SUMS
          [ -f "dist/heroic-map-renderer-plugin-$version.jar" ] \
            || { echo "::error::$TAG hat kein Jar für Windows und Linux; v0.3.2 bis v0.4.0 hatten je Plattform eins"; exit 1; }
          (cd dist && sha256sum -c SHA256SUMS)

          jwt=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -X POST \
            "$HANGAR_API/authenticate?apiKey=$HANGAR_API_TOKEN" | jq -r .token)
          echo "::add-mask::$jwt"
          bash .github/notizen.sh "$version" > beschreibung.md
          jq -n --arg name "$version" --rawfile changelog beschreibung.md --argjson paper "$PAPER" \
            '{version: $name, channel: "Release", description: $changelog,
              platformDependencies: {PAPER: $paper}, files: [{platforms: ["PAPER"]}]}' > version.json
          # Bis zu drei Versuche, jeder erst mit dem Blick, ob es die Version schon gibt: So scheitert weder ein
          # zweiter Lauf noch ein Versuch nach einem Upload, der trotz Fehler bei Hangar ankam.
          fertig=
          for versuch in 1 2 3; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $jwt" \
              "$HANGAR_API/projects/$HANGAR_PROJEKT/versions/$version" || true)
            if [ "$status" = 200 ]; then
              echo "$version gibt es auf Hangar"
              fertig=1
              break
            fi
            if [ "$status" = 404 ] && curl -fsS -X POST -H "Authorization: Bearer $jwt" \
              -F "versionUpload=@version.json;type=application/json" \
              -F "files=@dist/heroic-map-renderer-plugin-$version.jar;type=application/java-archive" \
              "$HANGAR_API/projects/$HANGAR_PROJEKT/upload"; then
              echo
              fertig=1
              break
            fi
            if [ "$status" = 404 ]; then grund="der Upload scheiterte"; else grund="Hangar antwortet mit ${status:-nichts}"; fi
            echo "::warning::$version, Versuch $versuch: $grund"
            [ "$versuch" = 3 ] || sleep 10
          done
          [ -n "$fertig" ] || { echo "::error::$version nicht auf Hangar"; exit 1; }
