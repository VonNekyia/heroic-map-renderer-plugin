name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gradle:
    name: Gradle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Prüft auch, dass gradle-wrapper.jar ein Wrapper von Gradle ist.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build und Tests
        timeout-minutes: 15
        run: ./gradlew build --console=plain

  doku:
    name: Doku
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Die Prüfung des Renderers, damit es sie nur einmal gibt. Mit
      # shell: bash gilt pipefail, sonst ginge ein Fehler von curl durch.
      - name: Verweise, Links und Frontmatter
        timeout-minutes: 5
        shell: bash
        # Ohne die wörtlichen Kopien der Testvektoren: Ihre Beschreibung zeigt auf docs/plugin.md des Renderers.
        run: curl -fsSL https://raw.githubusercontent.com/VonNekyia/heroic-map-renderer/master/.github/pruefe-doku.sh | bash -s -- ':!src/test/resources/*.json'

      # Die Testvektoren des Tokens sind eine Kopie aus dem Renderer.
      - name: Testvektoren wie im Renderer
        timeout-minutes: 5
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/VonNekyia/heroic-map-renderer/master/renderer/tests/fixtures/token.json | diff - src/test/resources/token.json

      # Der Testvektor des Manifests ebenso.
      - name: Manifest wie im Renderer
        timeout-minutes: 5
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/VonNekyia/heroic-map-renderer/master/renderer/tests/fixtures/manifest.json | diff - src/test/resources/manifest.json

  karte:
    name: Jar mit Karte
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # Die Karte aus web/ des Renderers, Stand master. Siehe docs/webserver.md, „Die Karte im Jar“.
      - uses: actions/checkout@v7
        with:
          repository: VonNekyia/heroic-map-renderer
          path: renderer
          sparse-checkout: web

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: renderer/web/package-lock.json

      - name: Karte bauen
        timeout-minutes: 10
        working-directory: renderer/web
        run: npm ci && npm run build

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Jar mit Karte
        timeout-minutes: 15
        run: ./gradlew jar -Pweb="$GITHUB_WORKSPACE/renderer/web/dist" --console=plain

      - name: Karte im Jar
        run: |
          inhalt=$(unzip -Z1 build/libs/*.jar)
          for datei in web/index.html web/lizenzen.txt; do
            grep -qx "$datei" <<< "$inhalt" || { echo "::error::$datei fehlt im Jar"; exit 1; }
          done
