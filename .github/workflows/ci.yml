name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gradle:
    name: Gradle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build und Tests
        timeout-minutes: 15
        run: ./gradlew build --console=plain

  doku:
    name: Doku
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Verweise und Frontmatter
        timeout-minutes: 5
        run: bash .github/pruefe-doku.sh
