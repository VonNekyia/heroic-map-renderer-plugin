name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gradle:
    name: Gradle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Prüft auch, dass gradle-wrapper.jar ein Wrapper von Gradle ist.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build und Tests
        timeout-minutes: 15
        run: ./gradlew build --console=plain

  doku:
    name: Doku
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # Die Prüfung des Renderers, damit es sie nur einmal gibt. Mit
      # shell: bash gilt pipefail, sonst ginge ein Fehler von curl durch.
      - name: Verweise, Links und Frontmatter
        timeout-minutes: 5
        shell: bash
        run: curl -fsSL https://raw.githubusercontent.com/VonNekyia/heroic-map-renderer/master/.github/pruefe-doku.sh | bash
