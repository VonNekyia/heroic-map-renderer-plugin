name: Release

# Auf einem Tag vX.Y.Z das Jar mit Karte und Renderer für Windows und Linux
# bauen und als Entwurf eines GitHub-Releases ablegen. Ändert eine PR diese
# Datei, das Prüfskript oder den Build, baut sie das Jar ohne Entwurf.
# Siehe docs/entwicklung.md, „Release“.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", ".github/pruefe-jar.sh", ".github/notizen.sh", "CHANGELOG.md", "build.gradle.kts"]

# Nur der Job, der den Entwurf anlegt, darf schreiben.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  jar:
    name: Jar
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      # Auf einem Tag die Version aus dem Tag, in einer PR eine zur Probe. Die
      # Notizen gleich hier: Fehlt der Abschnitt in CHANGELOG.md, fällt der Lauf
      # vor dem Bauen; in einer PR mit dem neuesten Abschnitt.
      - name: Version und Notizen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version=${GITHUB_REF_NAME#v}; else version=0.0.0-probe; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::$GITHUB_REF_NAME ist keine Version wie v1.2.3"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then notizen=$version; else notizen=$(sed -n 's/^## //p' CHANGELOG.md | head -1); fi
          bash .github/notizen.sh "$notizen"

      # Binärs und Karte aus demselben Release des Renderers: holeRenderer lädt
      # und prüft die Archive, die Karte ist web/ im Archiv für Linux.
      - name: Renderer und Karte
        timeout-minutes: 15
        run: |
          ./gradlew holeRenderer --console=plain
          mkdir -p build/karte
          tar -xzf build/renderer/archive/*/heroic-map-renderer-linux-x64.tar.gz -C build/karte \
            --strip-components 1 heroic-map-renderer-linux-x64/web

      - name: Bauen und Tests
        timeout-minutes: 15
        run: ./gradlew build -Pversion="$VERSION" -Pweb="$PWD/build/karte/web" --console=plain

      - name: Prüfen
        run: |
          jar=build/libs/heroic-map-renderer-plugin-$VERSION.jar
          bash .github/pruefe-jar.sh "$jar"
          unzip -p "$jar" plugin.yml | grep -qx "version: '$VERSION'" \
            || { echo "::error::plugin.yml in $jar nennt nicht die Version $VERSION"; exit 1; }

      # Die API für JitPack, das sie aus dem Release lädt. Siehe docs/api.md, „Einbinden“.
      - name: API
        run: |
          ./gradlew :api:publishApiPublicationToReleaseRepository -Pversion="$VERSION" --console=plain
          mkdir -p build/api
          for d in .jar .pom .module -sources.jar -javadoc.jar; do
            cp "api/build/release/com/nekyia/api/$VERSION/api-$VERSION$d" build/api/
          done
          ls -l build/api

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: build/libs/heroic-map-renderer-plugin-${{ env.VERSION }}.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: api
          path: build/api/
          if-no-files-found: error

  release:
    name: Release-Entwurf
    needs: jar
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: api
          path: dist

      - name: Prüfsummen
        run: |
          test "$(ls dist/heroic-map-renderer-plugin-*.jar | wc -l)" -eq 1 || { echo "::error::erwartet ein Jar für beide Plattformen"; exit 1; }
          test "$(ls dist/api-* | wc -l)" -eq 5 || { echo "::error::erwartet fünf Dateien der API"; exit 1; }
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      # Nur ein Entwurf: Veröffentlichen ist Sache des Maintainers. Die Notizen,
      # englisch, schreibt notizen.sh aus CHANGELOG.md und NOTICE.
      - name: Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/notizen.sh "${GITHUB_REF_NAME#v}" > notizen.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --notes-file notizen.md dist/*
