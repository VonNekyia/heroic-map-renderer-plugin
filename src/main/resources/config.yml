# Siehe docs/konfiguration.md. Pfade relativ zum Ordner des Servers.

renderer:
  # Das Binär des Renderers; leer: das aus dem Jar, für Windows und Linux
  # auf x86_64. Nur für andere Plattformen oder ein eigenes Binär setzen.
  binary: ""
  # --assets, in dieser Reihenfolge; spätere überschreiben frühere.
  # Leer nur mit download-client-jar: true, siehe unten.
  assets: []
  # true: das Pack von Nexo als letzte Asset-Wurzel, so zeichnet die Karte
  # dessen eigene Blöcke. Jedes neue Pack braucht einen vollen Lauf.
  nexo: false
  # --data, in dieser Reihenfolge.
  data: []
  # true: die Grafikkarte darf zeichnen (--gpu auto), sonst nur die CPU.
  gpu: false
  # So viele Threads bekommt der Renderer für Updates (--threads); er läuft
  # immer mit niedrigster Priorität (--low-priority).
  threads: 1
  # Threads für volle Läufe und /heroicmap compact; 0: alle Kerne.
  full-run-threads: 0
  # Ohne assets lädt der Renderer das Client-Jar von Minecraft von Mojangs
  # Servern und nutzt daraus Texturen, Modelle und Biome. Das Jar gehört Mojang
  # und darf nicht weitergegeben werden. Mit true bestätigst du, dass du
  # Minecraft: Java Edition besitzt, und nimmst die Minecraft-EULA an:
  # https://www.minecraft.net/eula. eula=true des Servers zählt nicht.
  download-client-jar: false
  # Die Version des Client-Jars, etwa "26.2"; leer: die zur Welt.
  client-version: ""
  # true: jeder volle Lauf packt kompakt (--compact), rund die Hälfte der
  # Bytes für ein Mehrfaches der Zeit beim Kodieren. Gilt nur für einen neuen
  # Baum; einen bestehenden packt /heroicmap compact nach.
  compact: false

# Die Weltwurzel mit level.dat; leer: die Hauptwelt des Servers.
world: ""

# Die Wurzel der Kachelbäume, --tiles.
tiles: plugins/HeroicMap/tiles

# Mehrere Server hinter einem Proxy, siehe docs/mehrere-server.md.
karte:
  # Name dieses Servers, etwa "main"; nur, wenn der Proxy ihn nicht meldet.
  name: ""
  # Die Karte eines anderen Servers zeigen, etwa "main": Der Mod nimmt dann
  # ihren Ordner. Ohne Baum mit download: true. Leer: die eigene Karte.
  von: ""
  # Der Webserver von "von", wie dieser Server ihn erreicht, etwa
  # "http://127.0.0.1:8080": für dessen öffentliche Ebenen. Leer: keine.
  von-url: ""
  # Der Webserver von "von", wie Spieler ihn erreichen, etwa dessen
  # webserver.url: Der Mod holt Bilder und Banner der Ebenen dort, und
  # dieser Server braucht keinen eigenen Webserver. Leer: der eigene.
  von-oeffentlich: ""

# Alle so viele Minuten ein Update; 0 schaltet den Zeitplan ab.
# Dazu den Autosave von Paper auf 60 s, siehe docs/laeufe.md.
update-minutes: 2

# Je Eintrag ein Kachelbaum. Die Kamera in Anführungszeichen.
# download: true bietet einen Baum dem Mod zum Download an,
# nur mit camera "top-north", scale 4 und ohne cinematic.
# web: false nimmt einen Baum zum Download von der Webkarte.
# flat: true statt camera ist die einfarbige Ansicht, ein Pixel je Block,
# ohne direction, scale, cinematic und download.
# relief: slope oder shadows zeichnet ein Relief, nur mit camera "top-north",
# direction s, ohne cinematic und flat; none, die Vorgabe: keins.
trees:
  - camera: "2:1"

# Die Webkarte: Der Renderer liefert Karte und Kacheln selbst aus,
# siehe docs/webserver.md.
webserver:
  enabled: true
  # Adresse und Port; 0.0.0.0 für alle Netze.
  listen: "0.0.0.0:8080"
  # Wie Spieler den Webserver erreichen, etwa "https://karte.example.org";
  # nur für einen anderen Host, HTTPS oder einen Proxy. Leer: Der Mod nimmt
  # den Host des Spielservers und den Port aus listen oder public-port.
  url: ""
  # Steht ein Proxy davor, der Port, unter dem Spieler ihn erreichen; den
  # nennt die Freigabe ohne url dem Mod. 0: der Port aus listen.
  public-port: 0
  # Titel und Beschreibung der Seite, nur zusammen und mit url; leer: die des Builds.
  title: ""
  description: ""
  # Vorschaubild, relativ zu url oder eine Adresse; leer: keins.
  image: ""
  # Nur diese Ebenen sind beim Öffnen der Webkarte an, etwa
  # ["beispiel:staedte"]; alle anderen aus. Was ein Betrachter selbst
  # wählt, geht vor. Leer: visible jeder Ebene.
  ebenen-an: []
  # HTTPS: Kette und Schlüssel als PEM, beide oder keins. Leer: HTTP.
  tls-cert: ""
  tls-key: ""
  # Proxys vor dem Webserver, deren X-Real-IP er glaubt, nur als IP, etwa
  # ["127.0.0.1"]; für die Erkennung per IP, siehe docs/anmeldung.md.
  trusted-proxy: []
  # Ein zweiter Name der Karte nur mit A-Eintrag, etwa
  # "https://karte4.example.org"; so erkennt die Karte auch Browser mit
  # IPv6. Leer: nur die IP am Namen aus url. Nur mit url.
  erkennen-url: ""

# Kartendownload für den Mod, siehe docs/download.md.
download:
  # Volle Downloads, die der Server in 10 Minuten ausgibt, alle Spieler zusammen.
  voll-je-10-min: 10
  # Volle Downloads je Spieler in 7 Tagen.
  voll-je-woche: 5
  # Abgleiche je Spieler in 24 Stunden, von Hand und der tägliche zusammen.
  abgleich-je-tag: 1
  # Ab dieser Uhrzeit des Servers holt der erste Join eines Tages den Abgleich.
  abgleich-ab: "00:00"
  # Was die Kacheln sicher abdecken: Beginn des letzten Laufs minus so viele Minuten.
  reserve-minuten: 10
  # Der Name des Servers, unter dem der Mod die Karten ablegt, etwa "play.example.net"; nur ein Hostname.
  # Leer: kein Name, der Mod nimmt die Adresse, die der Spieler eingetippt hat.
  server-name: ""
