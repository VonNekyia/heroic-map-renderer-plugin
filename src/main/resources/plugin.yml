name: HeroicMap
version: '${version}'
main: com.nekyia.heroicmap.HeroicMapPlugin
api-version: '26.2'
description: Rendert die Karte des Heroic Map Renderer auf dem Server.
website: https://github.com/VonNekyia/heroic-map-renderer-plugin
# Simple Voice Chat vor diesem Plugin, falls da; für die Mitspieler, siehe docs/mitspieler.md.
softdepend: [voicechat]
commands:
  heroicmap:
    description: Karte rendern, Update, Nachverdichten, Status, Abbruch, Ebenen neu laden
    usage: /<command> render|update|compact|status|cancel|layers
    permission: heroicmap.admin
permissions:
  heroicmap.admin:
    description: Läufe des Renderers starten und abbrechen
    default: op
  heroicmap.show:
    description: Mitspieler auf der Karte im Mod sehen und gesehen werden, siehe docs/mitspieler.md
    default: true
